<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GIP Reviewer — Automate Filing (H4 EAD)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="https://gip-us.com/wp-content/uploads/2023/12/gipuheader.png" />
<style>
  :root{
    --primary:#204496; --primary-2:#2e57b8; --primary-soft:#e8edf8;
    --bg:#f3f5fa; --card:#ffffff;
    --ink:#1a1f2e; --ink-soft:#5b6376; --ink-faint:#9aa1b2;
    --line:#e6e9f0; --line-soft:#eef1f7;
    --green:#1f8a52; --green-soft:#e4f3ea;
    --amber:#b8791a; --amber-soft:#fbf0db;
    --orange:#e14a28; --orange-soft:#fbe8e2;
    --blue:#2f6fb0;  --blue-soft:#e6eff8;
    --violet:#6b4ce0;--violet-soft:#ece7fb;
    --side-bg:#0e1326; --side-bg-2:#111733;
    --side-text:#aab2c6; --side-text-hi:#ffffff;
    --side-line:#222a45;
    --accent:#4d82f0; --accent-soft:rgba(77,130,240,.14);
    --font:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .spin{animation:spin 1s linear infinite;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#d3d8e4;border-radius:9px;}
  button{font-family:var(--font);cursor:pointer;}
  .shell{display:flex;height:100vh;}

  /* ═══ SIDEBAR ═══ */
  .sidebar{width:252px;flex-shrink:0;background:linear-gradient(180deg,var(--side-bg),var(--side-bg-2));
    display:flex;flex-direction:column;transition:width .22s ease;border-right:1px solid var(--side-line);}
  .sidebar.collapsed{width:74px;}
  .side-head{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;}
  .brand-mini{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:none;
    background:#fff;color:var(--primary);font-weight:800;font-size:17px;
    align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(32,68,150,.35);}
  .brand-txt{overflow:hidden;white-space:nowrap;}
  .brand-logo{display:inline-flex;align-items:center;background:#fff;border-radius:9px;
    padding:7px 11px;box-shadow:0 2px 12px rgba(0,0,0,.28);}
  .brand-logo img{height:26px;width:auto;display:block;}
  .brand-sub{font-size:9.5px;font-weight:600;color:var(--ink-faint);letter-spacing:.14em;
    text-transform:uppercase;margin-top:8px;}
  .collapse-btn{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;
    background:transparent;color:var(--side-text);display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .collapse-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar.collapsed .side-head{justify-content:center;padding:18px 0 16px;}
  .sidebar.collapsed .brand-txt,.sidebar.collapsed .collapse-btn{display:none;}
  .sidebar.collapsed .brand-mini{display:flex;}
  .nav{flex:1;overflow-y:auto;padding:6px 12px;}
  .nav-label{font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:.12em;
    text-transform:uppercase;padding:14px 10px 7px;}
  .sidebar.collapsed .nav-label{text-align:center;font-size:8px;padding:14px 0 7px;}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-radius:10px;border:none;background:transparent;color:var(--side-text);font-size:13.5px;
    font-weight:500;text-align:left;margin-bottom:3px;transition:all .15s;white-space:nowrap;overflow:hidden;text-decoration:none;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:var(--side-text-hi);}
  .nav-item.active{background:var(--accent-soft);color:#fff;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .nav-item .ico{flex-shrink:0;display:flex;}
  .nav-item.active .ico{color:var(--accent);}
  .nav-item .lbl{overflow:hidden;text-overflow:ellipsis;}
  .sidebar.collapsed .nav-item{justify-content:center;padding:11px 0;}
  .sidebar.collapsed .nav-item .lbl{display:none;}
  .sidebar.collapsed .nav-item:hover::after{content:attr(data-label);position:absolute;left:calc(100% + 10px);
    top:50%;transform:translateY(-50%);background:#1c2340;color:#fff;font-size:12px;font-weight:500;
    padding:6px 10px;border-radius:7px;white-space:nowrap;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .side-foot{padding:10px 12px 14px;border-top:1px solid var(--side-line);}
  .foot-item{width:100%;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;
    border:none;background:transparent;color:var(--side-text);font-size:13px;font-weight:500;
    margin-bottom:2px;transition:all .15s;white-space:nowrap;overflow:hidden;}
  .foot-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .foot-item .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:9.5px;font-weight:700;
    min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .sidebar.collapsed .foot-item{justify-content:center;padding:9px 0;}
  .sidebar.collapsed .foot-item .lbl,.sidebar.collapsed .foot-item .badge{display:none;}
  .user{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-top:6px;border-radius:10px;transition:background .15s;}
  .user:hover{background:rgba(255,255,255,.05);}
  .avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:var(--orange);color:#fff;
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .user-txt{overflow:hidden;white-space:nowrap;}
  .user-name{font-size:13px;font-weight:600;color:#fff;line-height:1.1;}
  .user-role{font-size:11px;color:var(--ink-faint);}
  .sidebar.collapsed .user{justify-content:center;padding:10px 0;}
  .sidebar.collapsed .user-txt{display:none;}

  /* ═══ MAIN ═══ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;
    background:var(--card);border-bottom:1px solid var(--line);}
  .topbar h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .topbar .date{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .top-search{position:relative;}
  .top-search input{width:230px;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);font-family:var(--font);font-size:13px;outline:none;}
  .top-search input:focus{border-color:var(--primary);background:#fff;}
  .top-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .btn-primary{padding:9px 16px;border-radius:9px;border:none;background:var(--primary);color:#fff;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:0 2px 10px rgba(32,68,150,.22);}
  .icon-btn-top{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;}
  .icon-btn-top .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
    background:var(--orange);border:1.5px solid #fff;}

  .workspace{flex:1;display:flex;min-height:0;background:var(--bg);}

  /* === LEFT: case list === */
  .cases{width:340px;flex-shrink:0;border-right:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;}
  .cases-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft);}
  .ch-title{font-size:14px;font-weight:700;letter-spacing:-.005em;}
  .ch-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;
    text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .tab{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;
    transition:all .15s;}
  .tab .cnt{font-size:9.5px;opacity:.75;}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .case-list{flex:1;overflow-y:auto;padding:10px 12px 14px;}

  .case{position:relative;width:100%;text-align:left;padding:13px 14px 13px 16px;border-radius:12px;
    border:1px solid var(--line);background:#fff;margin-bottom:8px;overflow:hidden;transition:all .18s;}
  .case:hover{border-color:#d4d9e6;}
  .case.active{border-color:var(--primary);box-shadow:0 2px 14px rgba(32,68,150,.10);}
  .case .rail{position:absolute;left:0;top:0;bottom:0;width:3px;}
  .case-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .case-name{font-size:13.5px;font-weight:700;letter-spacing:-.005em;}
  .case-id{font-size:10px;color:var(--ink-faint);font-weight:500;}
  .case-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;font-weight:500;}
  .case-meta{display:flex;align-items:center;gap:8px;margin-top:10px;justify-content:space-between;}
  .mismatch-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:7px;}
  .mismatch-badge.clean{background:var(--green-soft);color:var(--green);}
  .mismatch-badge.warn{background:var(--amber-soft);color:var(--amber);}
  .mismatch-badge.bad{background:var(--orange-soft);color:var(--orange);}
  .case-meta .when{font-size:10.5px;color:var(--ink-faint);font-weight:500;}

  /* === CENTER: compare panel === */
  .compare{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
  .c-bar{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border-bottom:1px solid var(--line);}
  .c-bar-l{display:flex;align-items:center;gap:14px;}
  .c-ico-lg{width:42px;height:42px;border-radius:11px;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;}
  .c-title{font-size:15.5px;font-weight:700;letter-spacing:-.005em;}
  .c-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;font-weight:500;}
  .c-pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
    padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;}
  .c-pill.clean{background:var(--green-soft);color:var(--green);}
  .c-pill.warn{background:var(--amber-soft);color:var(--amber);}
  .c-pill.bad{background:var(--orange-soft);color:var(--orange);}
  .c-actions{display:flex;gap:8px;}
  .btn-ghost{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .btn-ghost:hover{background:var(--bg);}
  .btn-file{padding:9px 16px;border-radius:9px;border:none;background:var(--green);color:#fff;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:0 2px 10px rgba(31,138,82,.25);}
  .btn-file:disabled{background:var(--ink-faint);box-shadow:none;cursor:not-allowed;}

  .c-body{flex:1;overflow-y:auto;padding:22px 24px 32px;}

  .compare-head{display:grid;grid-template-columns:1fr 22px 1fr;gap:0;
    background:var(--card);border:1px solid var(--line);border-radius:12px 12px 0 0;
    padding:11px 16px;font-size:11px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.06em;border-bottom:none;}
  .compare-head .col-r{text-align:right;}
  .compare-head .src{font-size:9.5px;font-weight:600;color:var(--ink-faint);margin-left:6px;text-transform:none;letter-spacing:0;}

  .compare-rows{background:var(--card);border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:hidden;}
  .crow{display:grid;grid-template-columns:1fr 22px 1fr;gap:0;align-items:center;padding:13px 16px;
    border-bottom:1px solid var(--line-soft);font-size:13px;}
  .crow:last-child{border-bottom:none;}
  .crow .extracted{font-weight:600;font-variant-numeric:tabular-nums;}
  .crow .record{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-soft);}
  .crow .arrow{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);}
  .crow.diff{background:var(--orange-soft);}
  .crow.diff .extracted{color:var(--orange);}
  .crow.diff .record{color:var(--ink);}
  .crow.diff .arrow{color:var(--orange);}
  .crow.warn{background:var(--amber-soft);}
  .crow.warn .extracted{color:var(--amber);}
  .crow.warn .arrow{color:var(--amber);}
  .crow .key{font-size:11.5px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:4px;}
  .crow .v{display:flex;flex-direction:column;}
  .crow .v.r{align-items:flex-end;}
  .crow .v.r .key{align-self:flex-end;}

  .sec-head{margin:22px 6px 10px;font-size:12px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.08em;}
  .sec-head:first-child{margin-top:0;}

  /* === RIGHT: mismatch panel === */
  .audit{width:380px;flex-shrink:0;border-left:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;}
  .audit-head{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);}
  .audit-title{font-size:15px;font-weight:700;letter-spacing:-.005em;}
  .audit-sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
  .scorecard{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
    display:flex;align-items:center;gap:14px;}
  .score-ring{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;flex-shrink:0;color:#fff;font-variant-numeric:tabular-nums;}
  .score-info{flex:1;min-width:0;}
  .score-lbl{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .score-head{font-size:14px;font-weight:700;margin-top:3px;letter-spacing:-.005em;}
  .score-note{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

  .audit-list{flex:1;overflow-y:auto;padding:14px 18px 18px;}
  .issue{padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#fff;margin-bottom:10px;}
  .issue.bad{border-color:var(--orange);box-shadow:0 1px 10px rgba(225,74,40,.06);}
  .issue.warn{border-color:var(--amber);box-shadow:0 1px 10px rgba(184,121,26,.05);}
  .issue-top{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .issue-key{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;letter-spacing:-.005em;}
  .issue-key .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;animation:pulse 2s ease-in-out infinite;}
  .issue.bad .issue-key .dot{background:var(--orange);}
  .issue.warn .issue-key .dot{background:var(--amber);}
  .issue-sev{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;text-transform:uppercase;}
  .issue.bad .issue-sev{background:var(--orange-soft);color:var(--orange);}
  .issue.warn .issue-sev{background:var(--amber-soft);color:var(--amber);}
  .issue-body{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45;}
  .issue-body b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
  .issue-actions{display:flex;gap:8px;margin-top:11px;}
  .issue-actions button{flex:1;padding:7px 10px;font-size:11.5px;font-weight:600;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:5px;}
  .issue-actions button.fix{background:var(--primary);border-color:var(--primary);color:#fff;}

  .audit-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);
    display:flex;align-items:center;gap:7px;font-weight:500;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite;}
</style>
</head>
<body>
<div class="shell">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand-mini">G</div>
      <div class="brand-txt">
        <div class="brand-logo"><img src="https://gip-us.com/wp-content/uploads/2023/12/gipuheader.png" alt="GIP" /></div>
        <div class="brand-sub"></div>
      </div>
      <button class="collapse-btn" id="collapseBtn" title="Collapse">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="foot-item" data-label="Status">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12" y2="20"/></svg></span>
        <span class="lbl">Status</span>
      </button>
      <button class="foot-item" data-label="Notifications">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
        <span class="lbl">Notifications</span>
        <span class="badge">3</span>
      </button>
      <div class="user" data-label="Austin">
        <div class="avatar">A</div>
        <div class="user-txt">
          <div class="user-name">Austin</div>
          <div class="user-role">admin</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1>Automate Filing (H4 EAD)</h1>
        <div class="date" id="pageDate"></div>
      </div>
      <div class="top-actions">
        <div class="top-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" placeholder="Search applicants…" />
        </div>
        <button class="icon-btn-top"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></button>
        <button id="uploadFilingBtn" class="btn-primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>New Case</button>
      </div>
    </div>

    <!-- error banner -->
    <div id="errBanner" style="display:none;margin:12px 30px 0;padding:9px 14px;border-radius:9px;background:var(--orange-soft);border:1px solid rgba(225,74,40,.25);font-size:12px;color:var(--orange);"></div>

    <!-- New Case modal -->
    <div id="newCaseModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:16px;padding:28px 28px 22px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25);">
        <div style="font-size:16px;font-weight:700;margin-bottom:18px;">New H-4 EAD Case</div>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;">Applicant Name (H-4 holder)</label>
        <input id="ncApplicant" placeholder="e.g. Priya Nair" style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);font-family:var(--font);font-size:13.5px;margin-bottom:14px;outline:none;" />
        <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;">H-1B Sponsor (spouse's name)</label>
        <input id="ncSponsor" placeholder="e.g. Rohit Nair (H-1B)" style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);font-family:var(--font);font-size:13.5px;margin-bottom:20px;outline:none;" />
        <div style="display:flex;gap:10px;">
          <button id="ncCancelBtn" style="flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);background:#fff;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;">Cancel</button>
          <button id="ncCreateBtn" style="flex:1;padding:10px;border-radius:9px;border:none;background:var(--primary);color:#fff;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;">Create &amp; Run</button>
        </div>
      </div>
    </div>

    <div class="workspace">

      <!-- LEFT: Cases -->
      <aside class="cases">
        <div class="cases-head">
          <div class="ch-title">Filing Queue</div>
          <div class="ch-sub">H4-EAD · Pre-submission Review</div>
          <div class="tabs" id="tabs"></div>
        </div>
        <div class="case-list" id="caseList"></div>
      </aside>

      <!-- CENTER: Compare -->
      <section class="compare">
        <div class="c-bar">
          <div class="c-bar-l">
            <div class="c-ico-lg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13l1.5 1.5L13 12"/></svg></div>
            <div>
              <div class="c-title" id="cTitle"></div>
              <div class="c-sub" id="cSub"></div>
            </div>
            <div id="cPill"></div>
          </div>
          <div class="c-actions">
            <button id="rerunBtn" class="btn-ghost"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.5L21 8"/><polyline points="21 3 21 8 16 8"/></svg>Re-run check</button>
            <button class="btn-file" id="fileBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>File to USCIS</button>
          </div>
        </div>

        <div class="c-body" id="cBody"></div>
      </section>

      <!-- RIGHT: Audit -->
      <aside class="audit">
        <div class="audit-head">
          <div class="audit-title">Mismatch Audit</div>
          <div class="audit-sub">Issues flagged on this filing</div>
          <div class="scorecard" id="scorecard"></div>
        </div>
        <div class="audit-list" id="auditList"></div>
        <div class="audit-foot">
          <span class="live-dot"></span>
          Live cross-check against case record · <span style="font-weight:600;color:var(--ink-soft);">v2.4</span>
        </div>
      </aside>

    </div>
  </main>
</div>

<script>
const API = '/api';

const ICONS = {
  dashboard:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>',
  notice:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13l1.5 1.5L13 12"/></svg>',
  compliance:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 11.5 11 13.5 15 9.5"/></svg>',
  filing:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>',
  arrow:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  warn:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/></svg>',
  spin:'<svg class="spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
};

const NAV = [
  {id:'dashboard',  label:'Dashboard',                href:'gip-dashboard.html',  icon:ICONS.dashboard},
  {id:'notice',     label:'Notice Processing',        href:'gip-notice.html',     icon:ICONS.notice},
  {id:'compliance', label:'Compliance Doc (PAF)',     href:'gip-compliance.html', icon:ICONS.compliance},
  {id:'filing',     label:'Automate Filing (H4 EAD)', href:'gip-autofiling.html', icon:ICONS.filing},
];
const ACTIVE_NAV = 'filing';

function renderNav(){
  document.getElementById('nav').innerHTML =
    '<div class="nav-label lbl">Workspace</div>' +
    NAV.map(n=>`<a class="nav-item ${n.id===ACTIVE_NAV?'active':''}" href="${n.href}" data-label="${n.label}">
      <span class="ico">${n.icon}</span><span class="lbl">${n.label}</span>
    </a>`).join('');
}

/* ─── State ─── */
let CASES = [];
let activeId = null;
let filter = 'all';
let searchQ = '';

const SEV_COLOR = {clean:'var(--green)', warn:'var(--amber)', bad:'var(--orange)'};
const SEV_LABEL = {clean:'Clean', warn:'Warning', bad:'Needs Review'};

/* ─── Field groupings for compare panel ─── */
const SECTIONS = [
  ['Applicant Identity', ['Full Legal Name','Date of Birth','Passport Number','Passport Expiry','Country of Birth']],
  ['Entry & Status',     ['Most Recent Entry Date','Visa Class on Entry']],
  ['Filing Detail',      ['Current Address']],
];

/* ─── Error banner ─── */
function setError(msg){
  const el = document.getElementById('errBanner');
  if(msg){ el.textContent = msg; el.style.display = 'block'; }
  else { el.style.display = 'none'; el.textContent = ''; }
}

/* ─── Map UC3 case to display severity ─── */
function caseSeverity(c){
  const counts = c.counts||{};
  if(counts.Error > 0) return 'bad';
  if(counts.Warning > 0) return 'warn';
  return 'clean';
}

function caseScore(c){
  const counts = c.counts||{};
  const total = counts.Total||0;
  if(!total) return 0;
  return Math.round(((counts.Match||0)/total)*100);
}

function caseMismatches(c){
  const counts = c.counts||{};
  return (counts.Error||0) + (counts.Warning||0);
}

function caseState(c){
  const status = c.status||c.counts?.status||'';
  if(status==='Filed') return 'filed';
  if(caseMismatches(c) > 0) return 'review';
  return 'clean';
}

/* ─── Render tabs ─── */
function renderTabs(){
  const q = searchQ.toLowerCase();
  const visible = q ? CASES.filter(c=>c.applicant.toLowerCase().includes(q)) : CASES;
  const counts = {
    all: visible.length,
    flagged: visible.filter(c=>caseSeverity(c)!=='clean' && caseState(c)!=='filed').length,
    clean: visible.filter(c=>caseSeverity(c)==='clean' && caseState(c)!=='filed').length,
    filed: visible.filter(c=>caseState(c)==='filed').length,
  };
  const tabs = [['all','All'],['flagged','Flagged'],['clean','Clean'],['filed','Filed']];
  document.getElementById('tabs').innerHTML = tabs.map(([k,l])=>
    `<button class="tab ${filter===k?'active':''}" data-tab="${k}">${l}<span class="cnt">${counts[k]}</span></button>`
  ).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{filter=b.dataset.tab;renderTabs();renderList();});
}

function passFilter(c){
  if(filter==='all') return true;
  if(filter==='flagged') return caseSeverity(c)!=='clean' && caseState(c)!=='filed';
  if(filter==='clean') return caseSeverity(c)==='clean' && caseState(c)!=='filed';
  if(filter==='filed') return caseState(c)==='filed';
  return true;
}

/* ─── Render list ─── */
function renderList(){
  const q = searchQ.toLowerCase();
  let list = q ? CASES.filter(c=>c.applicant.toLowerCase().includes(q)) : CASES;
  list = list.filter(passFilter);
  if(!list.length){
    document.getElementById('caseList').innerHTML = `<div style="text-align:center;color:var(--ink-faint);font-size:12.5px;padding:30px 10px;">${CASES.length?'No filings match this filter.':'No cases yet. Click <b>New Case</b> to create one.'}</div>`;
    return;
  }
  document.getElementById('caseList').innerHTML = list.map(c=>{
    const sev = caseSeverity(c);
    const state = caseState(c);
    const mm = caseMismatches(c);
    const badge = state==='filed'
      ? `<span class="mismatch-badge clean">FILED</span>`
      : `<span class="mismatch-badge ${sev}">${mm} ${mm===1?'mismatch':'mismatches'}</span>`;
    const when = c.createdAt ? new Date(c.createdAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    return `<button class="case ${c.id===activeId?'active':''}" data-id="${c.id}">
      <span class="rail" style="background:${SEV_COLOR[sev]};"></span>
      <div class="case-top">
        <div>
          <div class="case-name">${c.applicant}</div>
          <div class="case-sub">Sponsor: ${c.primary||'—'}</div>
        </div>
        <span class="case-id">#${c.id.slice(-6)}</span>
      </div>
      <div class="case-meta">${badge}<span class="when">${when}</span></div>
    </button>`;
  }).join('');
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{activeId=b.dataset.id;renderAll();});
}

/* ─── Render compare panel ─── */
function renderCompare(){
  const c = CASES.find(x=>x.id===activeId);
  if(!c){
    document.getElementById('cTitle').textContent = 'Select a case';
    document.getElementById('cSub').textContent = '';
    document.getElementById('cPill').innerHTML = '';
    document.getElementById('cBody').innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-faint);">Select a case from the list.</div>';
    document.getElementById('fileBtn').disabled = true;
    document.getElementById('rerunBtn').disabled = true;
    return;
  }
  document.getElementById('rerunBtn').disabled = false;
  document.getElementById('cTitle').textContent = `${c.applicant} — I-765 · H4-EAD`;
  document.getElementById('cSub').textContent = `Case ${c.id.slice(-6)} · Sponsor: ${c.primary||'—'}`;
  const sev = caseSeverity(c);
  document.getElementById('cPill').innerHTML = `<span class="c-pill ${sev}">${SEV_LABEL[sev]}</span>`;
  const fileBtn = document.getElementById('fileBtn');
  const state = caseState(c);
  if(state==='filed'){
    fileBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Filed to USCIS';
    fileBtn.disabled = true;
  } else {
    fileBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>File to USCIS';
    fileBtn.disabled = sev === 'bad';
  }

  const rows = c.rows||[];
  const extracted = {}; const record = {};
  rows.forEach(r=>{ extracted[r.field]=r.extracted||'—'; record[r.field]=r.questionnaire||'—'; });
  const errorFields = rows.filter(r=>r.severity==='error').map(r=>r.field);
  const warnFields = rows.filter(r=>r.severity==='warning').map(r=>r.field);

  if(!rows.length){
    document.getElementById('cBody').innerHTML = `<div style="padding:40px;text-align:center;color:var(--ink-faint);">
      <div style="font-size:13px;font-weight:600;color:var(--ink-soft);">No extraction yet</div>
      <div style="font-size:12px;margin-top:6px;">Click <b>Re-run check</b> to extract fields from documents.</div>
    </div>`;
    return;
  }

  let html = `<div class="compare-head">
    <span>Extracted <span class="src">(documents)</span></span><span></span>
    <span class="col-r">Questionnaire <span class="src">(GIP record)</span></span>
  </div><div class="compare-rows">`;
  SECTIONS.forEach(([sec,keys])=>{
    html += `<div class="sec-head" style="grid-column:1/-1;padding:14px 16px 6px;font-size:11px;font-weight:700;color:var(--ink-faint);background:var(--bg);border-bottom:1px solid var(--line-soft);text-transform:uppercase;letter-spacing:.06em;">${sec}</div>`;
    keys.forEach(k=>{
      const ev = extracted[k]??'—'; const rv = record[k]??'—';
      const cls = errorFields.includes(k)?'diff':warnFields.includes(k)?'warn':'';
      html += `<div class="crow ${cls}">
        <div class="v"><span class="key">${k}</span><span class="extracted">${ev}</span></div>
        <div class="arrow">${cls?ICONS.warn:ICONS.arrow}</div>
        <div class="v r"><span class="key">${k}</span><span class="record">${rv}</span></div>
      </div>`;
    });
  });
  html += '</div>';
  document.getElementById('cBody').innerHTML = html;
}

/* ─── Render audit panel ─── */
function scoreColor(s){ return s>=95?'var(--green)':s>=80?'var(--amber)':'var(--orange)'; }

function renderAudit(){
  const c = CASES.find(x=>x.id===activeId);
  if(!c){ document.getElementById('scorecard').innerHTML=''; document.getElementById('auditList').innerHTML=''; return; }
  const score = caseScore(c);
  const rows = c.rows||[];
  const issues = rows.filter(r=>r.severity==='error'||r.severity==='warning').map(r=>({
    key: r.field, sev: r.severity==='error'?'bad':'warn',
    msg: `Extracted <b>${r.extracted||'—'}</b>, questionnaire has <b>${r.questionnaire||'—'}</b>${r.note?'. '+r.note:'.'}`
  }));
  const totalFields = rows.length || Object.keys(c.questionnaire||{}).length || 8;

  document.getElementById('scorecard').innerHTML = `
    <div class="score-ring" style="background:${scoreColor(score)};">${score}</div>
    <div class="score-info">
      <div class="score-lbl">Filing Readiness</div>
      <div class="score-head">${score>=95?'Ready to file':score>=80?'Review before filing':rows.length?'Blocking issues':'Run extraction first'}</div>
      <div class="score-note">${issues.length} issue${issues.length===1?'':'s'} across ${totalFields} fields</div>
    </div>`;

  const list = document.getElementById('auditList');
  if(!rows.length){
    list.innerHTML = `<div style="padding:30px 14px;text-align:center;color:var(--ink-faint);font-size:12.5px;">Run extraction to see issues.</div>`;
    return;
  }
  if(!issues.length){
    list.innerHTML = `<div style="padding:40px 14px;text-align:center;color:var(--ink-faint);">
      <div style="width:54px;height:54px;border-radius:14px;background:var(--green-soft);color:var(--green);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style="font-size:14px;font-weight:700;color:var(--ink);">All fields match</div>
      <div style="font-size:12px;margin-top:6px;">No discrepancies between documents and questionnaire.</div>
    </div>`;
    return;
  }
  list.innerHTML = issues.map(i=>`
    <div class="issue ${i.sev}">
      <div class="issue-top">
        <div class="issue-key"><span class="dot"></span>${i.key}</div>
        <span class="issue-sev">${i.sev==='bad'?'Mismatch':'Warning'}</span>
      </div>
      <div class="issue-body">${i.msg}</div>
      <div class="issue-actions">
        <button data-field="${i.key}" data-choice="document">Keep doc value</button>
        <button class="fix" data-field="${i.key}" data-choice="questionnaire">Use record value</button>
      </div>
    </div>`).join('');
}

/* ─── Load cases from API ─── */
async function loadCases(selectId){
  try {
    const d = await fetch(API+'/uc3/cases').then(r=>r.json());
    CASES = d.cases||[];
    if(selectId) activeId = selectId;
    else if(!activeId && CASES.length) activeId = CASES[0].id;
    setError(null);
  } catch(e){
    setError('Could not load cases: '+e.message);
  }
  renderAll();
}

/* ─── Re-run check ─── */
document.getElementById('rerunBtn').onclick = async () => {
  if(!activeId) return;
  const btn = document.getElementById('rerunBtn');
  const orig = btn.innerHTML; btn.innerHTML = ICONS.spin + ' Running…'; btn.disabled = true;
  setError(null);
  try {
    const resp = await fetch(API+'/uc3/cases/'+activeId+'/run', {method:'POST'});
    if(!resp.ok){ const e=await resp.json().catch(()=>({})); throw new Error(e.error||('HTTP '+resp.status)); }
    await loadCases(activeId);
  } catch(err){ setError('Extraction failed: '+err.message); }
  finally { btn.innerHTML = orig; btn.disabled = false; }
};

/* ─── Resolve mismatch buttons (delegated) ─── */
document.getElementById('auditList').onclick = async e => {
  const btn = e.target.closest('[data-choice]'); if(!btn||!activeId) return;
  const field = btn.dataset.field; const choice = btn.dataset.choice;
  setError(null);
  try {
    const resp = await fetch(API+'/uc3/cases/'+activeId+'/resolve', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({field, choice})
    });
    if(!resp.ok){ const e=await resp.json().catch(()=>({})); throw new Error(e.error||('HTTP '+resp.status)); }
    await loadCases(activeId);
  } catch(err){ setError('Resolve failed: '+err.message); }
};

/* ─── File to USCIS (download I-765 PDF) ─── */
document.getElementById('fileBtn').onclick = async () => {
  if(!activeId) return;
  const btn = document.getElementById('fileBtn');
  const orig = btn.innerHTML; btn.innerHTML = ICONS.spin + ' Filing…'; btn.disabled = true;
  setError(null);
  try {
    const resp = await fetch(API+'/uc3/cases/'+activeId+'/save', {method:'POST'});
    if(!resp.ok){ const e=await resp.json().catch(()=>({})); throw new Error(e.error||('HTTP '+resp.status)); }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = 'Form_I-765.pdf'; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    await loadCases(activeId);
  } catch(err){ setError('Filing failed: '+err.message); }
  finally { btn.innerHTML = orig; }
};

/* ─── New Case modal ─── */
document.getElementById('uploadFilingBtn').onclick = () => {
  document.getElementById('newCaseModal').style.display = 'flex';
  document.getElementById('ncApplicant').focus();
};
document.getElementById('ncCancelBtn').onclick = () => {
  document.getElementById('newCaseModal').style.display = 'none';
};
document.getElementById('ncCreateBtn').onclick = async () => {
  const applicant = document.getElementById('ncApplicant').value.trim();
  const primary = document.getElementById('ncSponsor').value.trim();
  if(!applicant){ document.getElementById('ncApplicant').focus(); return; }
  const btn = document.getElementById('ncCreateBtn');
  const orig = btn.textContent; btn.textContent = 'Creating…'; btn.disabled = true;
  setError(null);
  try {
    const resp = await fetch(API+'/uc3/cases', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({applicant, primary: primary||'—', visaType:'H-4'})
    });
    if(!resp.ok){ const e=await resp.json().catch(()=>({})); throw new Error(e.error||('HTTP '+resp.status)); }
    const d = await resp.json();
    document.getElementById('newCaseModal').style.display = 'none';
    document.getElementById('ncApplicant').value = '';
    document.getElementById('ncSponsor').value = '';
    await loadCases(d.case.id);
    // Auto-run extraction immediately
    try {
      await fetch(API+'/uc3/cases/'+d.case.id+'/run', {method:'POST'});
      await loadCases(d.case.id);
    } catch(_){ /* extraction optional */ }
  } catch(err){ setError('Create failed: '+err.message); }
  finally { btn.textContent = orig; btn.disabled = false; }
};

/* ─── Search ─── */
document.getElementById('searchInput').oninput = e => { searchQ = e.target.value; renderTabs(); renderList(); };

/* ─── Render all ─── */
function renderAll(){ renderNav(); renderTabs(); renderList(); renderCompare(); renderAudit(); }

/* ─── Sidebar & init ─── */
document.getElementById('collapseBtn').onclick = () => document.getElementById('sidebar').classList.toggle('collapsed');
document.getElementById('pageDate').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});

renderNav();
loadCases();
</script>
</body>
</html>
