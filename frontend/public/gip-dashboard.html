<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GIP Reviewer — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#204496; --primary-2:#2e57b8; --primary-soft:#e8edf8;
    --bg:#f3f5fa; --card:#ffffff;
    --ink:#1a1f2e; --ink-soft:#5b6376; --ink-faint:#9aa1b2;
    --line:#e6e9f0; --line-soft:#eef1f7;
    --green:#1f8a52; --green-soft:#e4f3ea;
    --amber:#b8791a; --amber-soft:#fbf0db;
    --orange:#e14a28; --orange-soft:#fbe8e2;
    --side-bg:#0e1326; --side-bg-2:#111733;
    --side-text:#aab2c6; --side-text-hi:#ffffff;
    --side-line:#222a45;
    --accent:#4d82f0; --accent-soft:rgba(77,130,240,.14);
    --font:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#d3d8e4;border-radius:9px;}
  button{font-family:var(--font);cursor:pointer;}
  .shell{display:flex;height:100vh;}
  .sidebar{width:252px;flex-shrink:0;background:linear-gradient(180deg,var(--side-bg),var(--side-bg-2));
    display:flex;flex-direction:column;transition:width .22s ease;border-right:1px solid var(--side-line);}
  .sidebar.collapsed{width:74px;}
  .side-head{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;}
  .brand-mark{width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(32,68,150,.4);}
  .brand-txt{overflow:hidden;white-space:nowrap;}
  .brand-name{font-size:18px;font-weight:800;color:#fff;letter-spacing:.04em;line-height:1;}
  .brand-sub{font-size:9.5px;font-weight:600;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;margin-top:3px;}
  .collapse-btn{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;
    background:transparent;color:var(--side-text);display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .collapse-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar.collapsed .side-head{justify-content:center;padding:18px 0 16px;}
  .sidebar.collapsed .brand-txt,.sidebar.collapsed .collapse-btn{display:none;}
  .nav{flex:1;overflow-y:auto;padding:6px 12px;}
  .nav-label{font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:.12em;text-transform:uppercase;padding:14px 10px 7px;}
  .sidebar.collapsed .nav-label{text-align:center;font-size:8px;padding:14px 0 7px;}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-radius:10px;border:none;background:transparent;color:var(--side-text);font-size:13.5px;
    font-weight:500;text-align:left;margin-bottom:3px;transition:all .15s;white-space:nowrap;overflow:hidden;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:var(--side-text-hi);}
  .nav-item.active{background:var(--accent-soft);color:#fff;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .nav-item .ico{flex-shrink:0;display:flex;}
  .nav-item.active .ico{color:var(--accent);}
  .nav-item .lbl{overflow:hidden;text-overflow:ellipsis;}
  .sidebar.collapsed .nav-item{justify-content:center;padding:11px 0;}
  .sidebar.collapsed .nav-item .lbl{display:none;}
  .sidebar.collapsed .nav-item:hover::after{content:attr(data-label);position:absolute;left:calc(100% + 10px);
    top:50%;transform:translateY(-50%);background:#1c2340;color:#fff;font-size:12px;font-weight:500;
    padding:6px 10px;border-radius:7px;white-space:nowrap;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .side-foot{padding:10px 12px 14px;border-top:1px solid var(--side-line);}
  .foot-item{width:100%;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;
    border:none;background:transparent;color:var(--side-text);font-size:13px;font-weight:500;
    margin-bottom:2px;transition:all .15s;white-space:nowrap;overflow:hidden;}
  .foot-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .foot-item .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:9.5px;font-weight:700;
    min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .sidebar.collapsed .foot-item{justify-content:center;padding:9px 0;}
  .sidebar.collapsed .foot-item .lbl,.sidebar.collapsed .foot-item .badge{display:none;}
  .user{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-top:6px;border-radius:10px;transition:background .15s;}
  .user:hover{background:rgba(255,255,255,.05);}
  .avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:var(--orange);color:#fff;
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .user-txt{overflow:hidden;white-space:nowrap;}
  .user-name{font-size:13px;font-weight:600;color:#fff;line-height:1.1;}
  .user-role{font-size:11px;color:var(--ink-faint);}
  .sidebar.collapsed .user{justify-content:center;padding:10px 0;}
  .sidebar.collapsed .user-txt{display:none;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;
    background:var(--card);border-bottom:1px solid var(--line);}
  .topbar h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .topbar .date{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .top-search{position:relative;}
  .top-search input{width:230px;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);font-family:var(--font);font-size:13px;outline:none;}
  .top-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .btn-primary{padding:9px 16px;border-radius:9px;border:none;background:var(--primary);color:#fff;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:0 2px 10px rgba(32,68,150,.22);}
  .icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;}
  .icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
    background:var(--orange);border:1.5px solid #fff;}
  .content{flex:1;overflow-y:auto;padding:26px 30px 40px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;position:relative;overflow:hidden;}
  .kpi .k-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:13px;}
  .kpi .k-val{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;}
  .kpi .k-lbl{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:6px;}
  .kpi .k-delta{font-size:11.5px;font-weight:600;margin-top:9px;display:inline-flex;align-items:center;gap:4px;}
  .grid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin-top:18px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-soft);}
  .panel-head h3{font-size:15px;font-weight:700;margin:0;}
  .panel-head a{font-size:12.5px;color:var(--primary);font-weight:600;text-decoration:none;}
  .panel-body{padding:8px 12px 12px;}
  .doc-row{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:10px;transition:background .15s;cursor:pointer;}
  .doc-row:hover{background:var(--bg);}
  .doc-ico{width:36px;height:36px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .doc-main{flex:1;min-width:0;}
  .doc-title{font-size:13.5px;font-weight:600;}
  .doc-sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;
    font-size:10.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;}
  .pill.ready{background:var(--primary-soft);color:var(--primary);}
  .pill.processing{background:var(--amber-soft);color:var(--amber);}
  .pill.completed{background:var(--green-soft);color:var(--green);}
  .conf{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;width:42px;text-align:right;}
  .bar-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
  .bar{width:100%;max-width:34px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--accent),var(--primary));transition:height .4s ease;}
  .bar-lbl{font-size:11px;color:var(--ink-faint);font-weight:600;}
  .chart{display:flex;align-items:flex-end;gap:12px;height:120px;padding:14px 18px 6px;}
  .empty-row{padding:20px;text-align:center;font-size:12.5px;color:var(--ink-faint);}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>
      </div>
      <div class="brand-txt">
        <div class="brand-name">GIP</div>
        <div class="brand-sub">Immigration · Reviewer</div>
      </div>
      <button class="collapse-btn" id="collapseBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="foot-item"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12" y2="20"/></svg></span><span class="lbl">Status</span></button>
      <button class="foot-item"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span><span class="lbl">Notifications</span><span class="badge">3</span></button>
      <div class="user"><div class="avatar">A</div><div class="user-txt"><div class="user-name">Austin</div><div class="user-role">admin</div></div></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <div class="date" id="pageDate"></div>
      </div>
      <div class="top-actions">
        <div class="top-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input placeholder="Search cases, notices…" />
        </div>
        <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></button>
        <a href="gip-notice.html" class="btn-primary" style="text-decoration:none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload
        </a>
      </div>
    </div>
    <div class="content" id="content"><div style="text-align:center;padding:40px;color:var(--ink-faint);">Loading…</div></div>
  </main>
</div>

<script>
const API = '/legal';
const ICONS = {
  dashboard:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>',
  notice:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13l1.5 1.5L13 12"/></svg>',
  compliance:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 11.5 11 13.5 15 9.5"/></svg>',
  filing:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>',
  file:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  spin:'<svg class="spin" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
  dot:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  check:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
};
const NAV = [
  {id:'dashboard',   label:'Dashboard',                icon:ICONS.dashboard, href:'gip-dashboard.html'},
  {id:'notice',      label:'Notice Processing',        icon:ICONS.notice,    href:'gip-notice.html'},
  {id:'compliance',  label:'Compliance Doc (PAF)',     icon:ICONS.compliance,href:'gip-compliance.html'},
  {id:'filing',      label:'Automate Filing (H4 EAD)', icon:ICONS.filing,    href:'gip-autofiling.html'},
];
const ACTIVE_NAV = 'dashboard';

function renderNav(){
  document.getElementById('nav').innerHTML =
    '<div class="nav-label lbl">Workspace</div>' +
    NAV.map(n=>`<a class="nav-item ${n.id===ACTIVE_NAV?'active':''}" href="${n.href}" data-label="${n.label}">
      <span class="ico">${n.icon}</span><span class="lbl">${n.label}</span>
    </a>`).join('');
}

function apiStatus(s){
  if(s==='processing') return 'processing';
  if(s==='approved'||s==='rejected') return 'completed';
  return 'ready';
}
function confTone(c){ return c>=95?'var(--green)':c>=85?'var(--amber)':'var(--orange)'; }

function pill(status){
  const ic = status==='processing'?ICONS.spin:status==='ready'?ICONS.dot:ICONS.check;
  const lbl = status==='processing'?'Processing':status==='ready'?'Ready':'Completed';
  return `<span class="pill ${status}">${ic}${lbl}</span>`;
}

async function loadAndRender(){
  let cases=[], total=0, ready=0, processing=0, completed=0;
  try {
    const d = await fetch(API+'/queue?limit=200').then(r=>r.json());
    cases = d.cases||[];
    total = d.total||cases.length;
    ready = cases.filter(c=>apiStatus(c.status)==='ready').length;
    processing = cases.filter(c=>c.status==='processing').length;
    completed = cases.filter(c=>apiStatus(c.status)==='completed').length;
  } catch(e){ /* offline */ }

  const kpis = [
    {val:total,     lbl:'In Queue',          delta:total+' total',       dc:'var(--ink-faint)', ic:ICONS.file,  bg:'var(--primary-soft)', icol:'var(--primary)'},
    {val:ready,     lbl:'Ready for Review',  delta:'Needs action',        dc:'var(--primary)',  ic:ICONS.dot,   bg:'var(--primary-soft)', icol:'var(--primary)'},
    {val:processing,lbl:'Processing',        delta:'Live',                dc:'var(--amber)',    ic:ICONS.spin,  bg:'var(--amber-soft)',   icol:'var(--amber)'},
    {val:completed, lbl:'Completed',         delta:'All time',            dc:'var(--green)',    ic:ICONS.check, bg:'var(--green-soft)',   icol:'var(--green)'},
  ];

  const recent = cases.slice(0,8);
  const docRows = recent.length ? recent.map(c=>{
    const st = apiStatus(c.status);
    const conf = c.field_count>0
      ? Math.round(((c.field_count-(c.low_confidence_count||0))/c.field_count)*100)
      : null;
    const uploaded = c.uploaded_at
      ? new Date(c.uploaded_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
      : '';
    return `<a class="doc-row" href="gip-notice.html" style="text-decoration:none;">
      <div class="doc-ico">${ICONS.file}</div>
      <div class="doc-main">
        <div class="doc-title">${c.form_type} — #${c.case_id.slice(0,8).toUpperCase()}</div>
        <div class="doc-sub">${uploaded}</div>
      </div>
      ${pill(st)}
      <div class="conf" style="color:${conf!==null?confTone(conf):'var(--ink-faint)'};">${conf!==null?conf+'%':'—'}</div>
    </a>`;
  }).join('') : `<div class="empty-row">No cases yet. <a href="gip-notice.html" style="color:var(--primary);font-weight:600;">Upload a document →</a></div>`;

  document.getElementById('content').innerHTML = `
  <div class="kpis">
    ${kpis.map(k=>`<div class="kpi">
      <div class="k-ico" style="background:${k.bg};color:${k.icol};">${k.ic}</div>
      <div class="k-val">${k.val}</div>
      <div class="k-lbl">${k.lbl}</div>
      <div class="k-delta" style="color:${k.dc};">${k.delta}</div>
    </div>`).join('')}
  </div>
  <div class="grid">
    <div class="panel">
      <div class="panel-head"><h3>Recent Documents</h3><a href="gip-notice.html">View queue →</a></div>
      <div class="panel-body">${docRows}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;">
      <div class="panel">
        <div class="panel-head"><h3>Queue Summary</h3></div>
        <div class="panel-body" style="padding:16px 18px;">
          ${[['Total in Queue',total,'var(--primary)'],['Ready for Review',ready,'var(--primary)'],
             ['Currently Processing',processing,'var(--amber)'],['Completed',completed,'var(--green)']].map(([l,v,c])=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);">
              <span style="font-size:13px;font-weight:500;color:var(--ink-soft);">${l}</span>
              <span style="font-size:15px;font-weight:700;color:${c};font-variant-numeric:tabular-nums;">${v}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Quick Actions</h3></div>
        <div class="panel-body" style="padding:12px 14px;">
          <a href="gip-notice.html" style="display:flex;align-items:center;gap:10px;padding:11px 12px;
            background:var(--primary);color:#fff;border-radius:10px;text-decoration:none;
            font-weight:600;font-size:13px;margin-bottom:8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Document
          </a>
          <a href="gip-notice.html" style="display:flex;align-items:center;gap:10px;padding:11px 12px;
