<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GIP Reviewer — Notice Processing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    /* GIP palette — shared with Dashboard */
    --primary:#204496; --primary-2:#2e57b8; --primary-soft:#e8edf8;
    --bg:#f3f5fa; --card:#ffffff;
    --ink:#1a1f2e; --ink-soft:#5b6376; --ink-faint:#9aa1b2;
    --line:#e6e9f0; --line-soft:#eef1f7;
    --green:#1f8a52; --green-soft:#e4f3ea;
    --amber:#b8791a; --amber-soft:#fbf0db;
    --orange:#e14a28; --orange-soft:#fbe8e2;
    --blue:#2f6fb0;  --blue-soft:#e6eff8;
    --violet:#6b4ce0;--violet-soft:#ece7fb;
    /* dark sidebar */
    --side-bg:#0e1326; --side-bg-2:#111733;
    --side-text:#aab2c6; --side-text-hi:#ffffff;
    --side-line:#222a45;
    --accent:#4d82f0; --accent-soft:rgba(77,130,240,.14);
    --font:'Inter',-apple-system,sans-serif;
    --mono:'Inter','SF Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .spin{animation:spin 1s linear infinite;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#d3d8e4;border-radius:9px;}
  button{font-family:var(--font);cursor:pointer;}
  .shell{display:flex;height:100vh;}

  /* ═══ SIDEBAR (shared) ═══ */
  .sidebar{width:252px;flex-shrink:0;background:linear-gradient(180deg,var(--side-bg),var(--side-bg-2));
    display:flex;flex-direction:column;transition:width .22s ease;border-right:1px solid var(--side-line);}
  .sidebar.collapsed{width:74px;}

  .side-head{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;}
  .brand-logo{height:44px;width:auto;max-width:180px;object-fit:contain;flex-shrink:0;display:block;}
  .brand-icon{width:30px;height:30px;border-radius:8px;flex-shrink:0;
    background:transparent;border:none;padding:0;cursor:pointer;
    color:var(--side-text);display:none;align-items:center;justify-content:center;
    transition:background .15s, color .15s;}
  .brand-icon:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar.collapsed .brand-logo{display:none;}
  .sidebar.collapsed .brand-icon{display:flex;margin:0 auto;}
  .collapse-btn{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;
    background:transparent;color:var(--side-text);display:flex;align-items:center;justify-content:center;
    transition:background .15s;}
  .collapse-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar.collapsed .side-head{justify-content:center;padding:18px 0 16px;}
  .sidebar.collapsed .collapse-btn{display:none;}

  .nav{flex:1;overflow-y:auto;padding:6px 12px;}
  .nav-label{font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:.12em;
    text-transform:uppercase;padding:14px 10px 7px;}
  .sidebar.collapsed .nav-label{display:none;}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-radius:10px;border:none;background:transparent;color:var(--side-text);font-size:12px;
    font-weight:500;text-align:left;margin-bottom:3px;transition:all .15s;white-space:nowrap;overflow:hidden;
    text-decoration:none;}
  a.nav-item,a.nav-item:hover,a.nav-item:focus{text-decoration:none;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:var(--side-text-hi);}
  .nav-item.active{background:var(--accent-soft);color:#fff;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .nav-item .ico{flex-shrink:0;display:flex;}
  .nav-item.active .ico{color:var(--accent);}
  .nav-item .lbl{overflow:hidden;text-overflow:ellipsis;}
  .sidebar.collapsed .nav-item{justify-content:center;padding:11px 0;}
  .sidebar.collapsed .nav-item .lbl{display:none;}
  .sidebar.collapsed .nav-item:hover::after{content:attr(data-label);position:absolute;left:calc(100% + 10px);
    top:50%;transform:translateY(-50%);background:#1c2340;color:#fff;font-size:12px;font-weight:500;
    padding:6px 10px;border-radius:7px;white-space:nowrap;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.4);}

  .side-foot{padding:10px 12px 14px;border-top:1px solid var(--side-line);}
  .foot-item{width:100%;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;
    border:none;background:transparent;color:var(--side-text);font-size:12px;font-weight:500;
    margin-bottom:2px;transition:all .15s;white-space:nowrap;overflow:hidden;}
  .foot-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  a.foot-item{text-decoration:none;}
  .foot-item .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:9.5px;font-weight:700;
    min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .sidebar.collapsed .foot-item{justify-content:center;padding:9px 0;}
  .sidebar.collapsed .foot-item .lbl,.sidebar.collapsed .foot-item .badge{display:none;}
  .user{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-top:6px;border-radius:10px;
    background:rgba(255,255,255,.04);border:1px solid var(--side-line);
    transition:background .15s, border-color .15s;}
  .user:hover{background:transparent;border-color:transparent;}
  .avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:var(--orange);color:#fff;
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .user-txt{overflow:hidden;white-space:nowrap;}
  .user-name{font-size:13px;font-weight:600;color:#fff;line-height:1.1;}
  .user-role{font-size:11px;color:var(--ink-faint);}
  .sidebar.collapsed .user{justify-content:center;padding:10px 0;}
  .sidebar.collapsed .user-txt{display:none;}
  .user{cursor:pointer;width:100%;text-align:left;border:none;font:inherit;}
  .user-caret{margin-left:auto;color:var(--ink-faint);display:flex;align-items:center;transition:transform .15s;}
  .user-wrap{position:relative;}
  .user-pop{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);
    background:#1a2236;border:1px solid var(--side-line);border-radius:10px;
    box-shadow:0 12px 28px rgba(0,0,0,.45);padding:5px;display:none;z-index:50;}
  .user-pop.open{display:block;}
  .user-pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
    border:none;background:transparent;color:var(--side-text);font-size:12.5px;font-weight:500;
    border-radius:7px;cursor:pointer;text-align:left;text-decoration:none;}
  .user-pop-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .user-pop-item .ico{display:flex;align-items:center;color:var(--ink-faint);}
  .user-pop-sep{height:1px;background:var(--side-line);margin:4px 6px;}
  .sidebar.collapsed .user-txt,.sidebar.collapsed .user-caret{display:none;}
  .sidebar.collapsed .user-pop{left:auto;right:-216px;bottom:6px;width:200px;}

  /* ═══ MAIN (shared topbar + page) ═══ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;
    background:var(--card);border-bottom:1px solid var(--line);}
  .topbar h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .topbar .date{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .top-search{position:relative;}
  .top-search input{width:230px;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);font-family:var(--font);font-size:13px;outline:none;}
  .top-search input:focus{border-color:var(--primary);background:#fff;}
  .top-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .btn-primary{padding:9px 16px;border-radius:9px;border:none;background:var(--primary);color:#fff;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:0 2px 10px rgba(32,68,150,.22);}
  .icon-btn-top{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;}
  .icon-btn-top .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
    background:var(--orange);border:1.5px solid #fff;}

  /* page area — full-bleed three-column workspace */
  .workspace{flex:1;display:flex;min-height:0;background:var(--bg);}

  /* ── LEFT: queue ── */
  .queue{width:320px;flex-shrink:0;border-right:1px solid var(--line);
    background:var(--card);display:flex;flex-direction:column;
    transition:width .22s ease;overflow:hidden;}
  .queue.collapsed{width:54px;}
  .queue.collapsed .q-head{padding:14px 8px;border-bottom:1px solid var(--line-soft);}
  .queue.collapsed .q-head-row{justify-content:center;}
  .queue.collapsed .q-head-row > div:first-child{display:none;}
  .queue.collapsed .search,.queue.collapsed .q-list,.queue.collapsed .q-foot{display:none;}
  .q-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft);}
  .q-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .q-toggle{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:all .15s;}
  .q-toggle:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-soft);}
  .q-title{font-size:14px;font-weight:700;letter-spacing:-.005em;}
  .q-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;
    text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
  .search{position:relative;margin-top:14px;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .search input{width:100%;padding:8px 10px 8px 32px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);font-family:var(--font);font-size:12.5px;outline:none;}
  .search input:focus{border-color:var(--primary);background:#fff;}
  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .tab{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;
    transition:all .15s;}
  .tab .cnt{font-size:9.5px;opacity:.75;}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .q-list{flex:1;overflow-y:auto;padding:10px 12px 14px;}
  .q-foot{padding:11px 18px;border-top:1px solid var(--line);display:flex;align-items:center;
    gap:7px;font-size:10.5px;color:var(--ink-faint);font-weight:500;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite;}

  /* queue card */
  .card{position:relative;width:100%;text-align:left;padding:13px 14px 13px 16px;border-radius:12px;
    border:1px solid var(--line);background:#fff;margin-bottom:8px;overflow:hidden;
    transition:all .18s;}
  .card:hover{border-color:#d4d9e6;}
  .card.active{border-color:var(--primary);background:#fff;box-shadow:0 2px 14px rgba(32,68,150,.10);}
  .rail{position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.55;}
  .card.active .rail{opacity:1;}
  .card .shim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 30%,rgba(184,121,26,.07) 50%,transparent 70%);
    background-size:200% 100%;animation:shimmer 1.8s linear infinite;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .ctype{font-size:14px;font-weight:700;letter-spacing:-.005em;}
  .hi{font-size:9px;font-weight:700;color:var(--orange);
    background:var(--orange-soft);padding:1px 6px;border-radius:5px;letter-spacing:.04em;}
  .cid{font-size:10px;color:var(--ink-faint);font-weight:500;}
  .capp{font-size:12.5px;font-weight:600;margin-top:5px;}
  .clabel{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .crow{display:flex;align-items:center;justify-content:space-between;margin-top:11px;}
  .cmeta{font-size:10.5px;color:var(--ink-faint);font-weight:500;}
  .cbar{margin-top:9px;height:3px;border-radius:999px;background:var(--line-soft);overflow:hidden;}
  .cbar > i{display:block;height:100%;background:var(--amber);border-radius:999px;transition:width .6s;}

  /* pill (shared shape with dashboard) */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;
    font-size:10.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;}
  .pill.processing{background:var(--amber-soft);color:var(--amber);}
  .pill.ready{background:var(--primary-soft);color:var(--primary);}
  .pill.tag-primary{background:var(--primary);color:#fff;}
  .pill.completed{background:var(--green-soft);color:var(--green);}

  /* ── CENTER: viewer ── */
  .viewer{flex:1;min-width:0;display:flex;flex-direction:column;background:#1a1f2e;}
  .v-bar{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border-bottom:1px solid var(--line);}
  .v-bar-l{display:flex;align-items:center;gap:12px;}
  .v-title{font-size:14.5px;font-weight:700;letter-spacing:-.005em;}
  .v-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;font-weight:500;}
  .pgnav{display:flex;align-items:center;gap:6px;}
  .pg-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .15s;}
  .pg-btn:hover{background:var(--bg);color:var(--ink);}
  .pg-btn:disabled{opacity:.35;cursor:not-allowed;background:#fff;color:var(--ink-soft);}
  .pg-num{font-size:12px;color:var(--ink-soft);min-width:56px;text-align:center;font-weight:600;
    font-variant-numeric:tabular-nums;}
  .canvas{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:32px;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0);
    background-size:22px 22px;}

  /* doc preview */
  .doc{background:#fff;width:520px;max-width:100%;border-radius:6px;padding:34px 38px;
    box-shadow:0 8px 40px rgba(0,0,0,.32);font-family:Georgia,serif;color:#111;font-size:11px;line-height:1.5;}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .seal{width:40px;height:40px;border-radius:50%;border:1.5px solid #333;display:flex;
    align-items:center;justify-content:center;font-size:7px;color:#555;}
  .doc-title{font-size:16px;font-weight:700;}
  .doc-rule{border-top:2px solid #111;border-bottom:2px solid #111;margin:16px 0;
    display:grid;grid-template-columns:60px 1fr 1fr 1fr;}
  .doc-rule > div{padding:8px 6px;font-size:8px;font-weight:700;min-height:50px;border-right:1px solid #ccc;}
  .doc-rule > div:last-child{border-right:none;}
  .sec{background:#e9e9e9;padding:5px 8px;font-weight:700;font-size:11px;}
  .ckbox{display:inline-block;width:11px;height:11px;border:1px solid #333;text-align:center;
    line-height:10px;margin-right:4px;font-size:9px;}
  .nm-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px;}
  .nm-grid .f-l{font-size:7px;color:#666;}
  .nm-grid .f-v{border:1px solid #999;padding:5px 6px;font-size:10px;}

  /* processing state */
  .proc{margin-top:80px;text-align:center;color:#aab2c6;}
  .proc h3{font-size:18px;margin:18px 0 6px;color:#fff;font-weight:700;letter-spacing:-.005em;}
  .proc p{font-size:13px;opacity:.75;margin:0;}
  .proc-bar{width:220px;height:5px;border-radius:999px;background:rgba(255,255,255,.1);
    margin:18px auto 0;overflow:hidden;}
  .proc-bar > i{display:block;height:100%;background:var(--amber);border-radius:999px;}

  /* ── RIGHT: fields ── */
  .fields{width:380px;flex-shrink:0;border-left:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;}
  .f-head{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);}
  .f-head-row{display:flex;justify-content:space-between;align-items:center;}
  .f-title{font-size:15px;font-weight:700;letter-spacing:-.005em;}
  .icon-btn-sm{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);transition:all .15s;}
  .icon-btn-sm:hover{background:var(--bg);color:var(--ink);}
  .conf-card{margin-top:12px;padding:11px 13px;border-radius:11px;background:var(--bg);
    border:1px solid var(--line);display:flex;align-items:center;gap:11px;}
  .conf-card .lbl{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .conf-track{flex:1;height:5px;border-radius:999px;background:var(--line-soft);overflow:hidden;}
  .conf-track > i{display:block;height:100%;border-radius:999px;}
  .summary{margin-top:10px;font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .summary .stat{display:inline-flex;align-items:center;gap:5px;font-weight:600;padding:3px 9px;
    border-radius:6px;}
  .summary .stat b{font-weight:700;font-variant-numeric:tabular-nums;}
  .f-list{flex:1;overflow-y:auto;padding:16px 18px;}
  .workspace.q-collapsed .fields{width:auto;flex:1;}
  .workspace.q-collapsed .f-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-content:start;}
  .workspace.q-collapsed .f-list .field{margin-bottom:0;}
  .workspace.q-hidden .queue{display:none;}
  .workspace.q-hidden .fields{width:auto;flex:1;}
  .workspace.q-hidden .f-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-content:start;}
  .workspace.q-hidden .f-list .field{margin-bottom:0;}
  .f-actions{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;}
  .btn-confirm{flex:1;padding:12px;border-radius:10px;border:none;background:var(--primary);color:#fff;
    font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;
    box-shadow:0 2px 10px rgba(32,68,150,.22);}

  /* field row */
  .field{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:10px;
    transition:box-shadow .15s;}
  .field:hover{box-shadow:0 2px 12px rgba(28,26,23,.05);}
  .field.low{border-color:var(--orange);box-shadow:0 1px 10px rgba(225,74,40,.06);}
  .field-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .field-key{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.005em;}
  .field-meta{display:flex;align-items:center;gap:10px;}
  .src{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 6px;border-radius:5px;}
  .src.native{color:var(--blue);background:var(--blue-soft);}
  .src.llm{color:var(--violet);background:var(--violet-soft);}
  .confbar{display:flex;align-items:center;gap:7px;}
  .confbar .track{width:38px;height:4px;border-radius:999px;background:var(--line-soft);overflow:hidden;}
  .confbar .track > i{display:block;height:100%;border-radius:999px;transition:width .5s;}
  .confbar .pct{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;}
  .field-input{position:relative;}
  .field-input input{width:100%;padding:9px 34px 9px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);font-family:var(--font);font-size:13.5px;color:var(--ink);outline:none;transition:all .15s;}
  .field-input input:focus{border-color:var(--primary);background:#fff;}
  .field-input svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);
    pointer-events:none;}
  .field-input input[type=date]{font-family:var(--font);}
  .field-input input[type=date]::-webkit-calendar-picker-indicator{position:absolute;right:0;top:0;
    width:36px;height:100%;margin:0;padding:0;opacity:0;cursor:pointer;}
  .field-input select{width:100%;padding:9px 34px 9px 12px;border-radius:9px;border:1px solid var(--line);

/* ─── notice review page — LIVE backend integration ─── */

/* Field display config: friendly label + input type + options, keyed by the
   backend snake_case field_name. Anything not listed renders as a text input. */

  primary_flag:           {label:'Primary Flag',           type:'select', options:['True','False']},
  sent_government_agency: {label:'Sent Government Agency',  type:'date'},
  receipt_for:            {label:'Receipt For',            type:'text'},

  country_of_birth:       {label:'Country of Birth',        type:'text'},

  class_of_admission:     {label:'Class of Admission',     type:'text'},
  ssn:                    {label:'SSN',                    type:'text'},
};

function fieldLabel(name){
  if(FIELD_CONFIG[name]) return FIELD_CONFIG[name].label;
  return String(name).replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
}

/* Live state */
let QUEUE = [];          // [{id, type, label, applicant, status, priority, fields, pages, time, primary, page_count}]
let DETAIL = null;       // full case detail for the active case
let FIELDS = [];         // mapped field rows for the active case
let activeId = null;
let batchIds = null;     // optional subset from the list page's bulk action

const FORM_LABELS = {
  'I-485':'Application to Adjust Status','I-130':'Petition for Alien Relative',
  'I-797':'Notice of Action','N-400':'Application for Naturalization',
  'I-765':'Application for Employment Auth.','I-140':'Immigrant Petition',
  'I-539':'Extend/Change Status','I-131':'Travel Document','I-129':'Nonimmigrant Worker',
  'I-90':'Replace Green Card','N-600':'Certificate of Citizenship','I-751':'Remove Conditions',
};

function apiStatusToView(s){
  if(s==='processing') return 'processing';
  if(s==='approved'||s==='completed'||s==='rejected') return 'completed';
  return 'ready'; // pending | in_review
}

function mapQueueCase(c){
  const short = (c.case_id||'').replace(/-/g,'').slice(0,8);
  return {
    id: c.case_id,
    type: c.form_type || '—',
    label: FORM_LABELS[c.form_type] || 'USCIS Notice',
    applicant: 'Case #' + short.toUpperCase(),
    status: apiStatusToView(c.status),
    raw_status: c.status,
    priority: c.priority || 'normal',
    fields: c.field_count || 0,
    pages: c.page_count || 0,
    time: c.uploaded_at ? new Date(c.uploaded_at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '',
    primary: c.priority === 'high',
    progress: c.status==='processing' ? 60 : undefined,
  };
}

/* convert a backend MM/DD/YYYY or other date string to yyyy-mm-dd for <input type=date> */
function toDateInput(v){
  if(!v) return '';
  const m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){ return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  const m2 = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return `${m2[1]}-${m2[2]}-${m2[3]}`;
  return v;
}

function mapField(f){
  const cfg = FIELD_CONFIG[f.field_name] || {type:'text'};
  let val = f.normalized_value ?? f.raw_value ?? '';
  if(cfg.type==='date') val = toDateInput(val);
  return {
    name: f.field_name,
    key: fieldLabel(f.field_name),
    value: val,
    conf: Math.round((f.confidence||0)*100),
    src: (f.source==='llm'||f.source==='llm_fallback') ? 'llm' : 'native',
    type: cfg.type,
    options: cfg.options,
    is_default: !!f.is_default,   // upstream flag: system default vs extracted value
  };
}

  pencil:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  calendar:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  spark:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L19 10l-5.1 1.2L12 17l-1.9-5.8L5 10l5.1-1.2z"/></svg>',
  chevron:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
};

function pillHTML(status, progress){
  const s = STATUS[status];
  const ic = status==='processing'?ICON.spin:status==='ready'?ICON.ready:ICON.check;
  const pct = (status==='processing' && progress!=null) ? `<span style="opacity:.7;">${progress}%</span>` : '';
  return `<span class="pill ${status}">${ic}${s.label}${pct}</span>`;
}

function confTone(c){ return c>=90?'var(--green)':c>=80?'var(--amber)':'var(--orange)'; }

function renderList(){
  const ws = document.getElementById('workspace');
  // Hide queue panel when: only one file, OR opened via ?case= (single-file view), OR batch of 1
  const params = new URLSearchParams(window.location.search);
  const singleView = !!params.get('case') && !params.get('batch');
  if(ws) ws.classList.toggle('q-hidden', QUEUE.length <= 1 || singleView);

  const list = QUEUE.filter(d=>{
    if(filter==='all')return true;
    if(filter==='review')return d.status==='ready';
    if(filter==='processing')return d.status==='processing';
    if(filter==='completed')return d.status==='completed';
  });
  document.getElementById('qlist').innerHTML = list.map(d=>{
    const s = STATUS[d.status];
    const meta = d.status==='processing' ? `${d.fields} / ${d.pages}p` : `${d.fields} fields`;
    return `<button class="card ${d.id===activeId?'active':''}" data-id="${d.id}">
      <span class="rail" style="background:${s.color};"></span>
      ${d.status==='processing'?'<span class="shim"></span>':''}
      <div class="card-top">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="ctype">${d.type}</span>
          ${d.priority==='high'?'<span class="hi">HIGH</span>':''}
        </div>
        <span class="cid">#${(d.id||'').slice(0,8)}</span>
      </div>
      <div class="capp">${d.applicant}</div>
      <div class="clabel">${d.label}</div>
      <div class="crow">${pillHTML(d.status,d.progress)}<span class="cmeta">${meta}</span></div>
      ${d.status==='processing'?`<div class="cbar"><i style="width:${d.progress}%;"></i></div>`:''}
    </button>`;
  }).join('');
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ selectCase(b.dataset.id); });
}

/* Load the full detail (fields) for a case from the backend, then render. */
async function selectCase(id){
  activeId = id;
  page = 1;
  renderList();
  renderViewer();          // PDF shows immediately
  // fetch fields
  try{
    const r = await fetch(`${API}/queue/${encodeURIComponent(id)}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    DETAIL = await r.json();
    FIELDS = (DETAIL.extracted_fields || [])
      .filter(f => (f.normalized_value ?? f.raw_value ?? '') !== '' || FIELD_CONFIG[f.field_name])
      .map(mapField);
  }catch(e){
    console.error('[GIP] case detail load failed', e);
    DETAIL = null; FIELDS = [];
  }
  renderFields();
  // If this case is still processing, poll until fields are ready
  const d = QUEUE.find(x=>x.id===id);
  if(d && d.status==='processing') startPolling(id);
  else stopPolling();
}

function startPolling(id){
  stopPolling();
  pollTimer = setInterval(async ()=>{
    try{
      const s = await fetch(`${API}/cases/${encodeURIComponent(id)}/status`).then(r=>r.json());
      if(s.status !== 'processing'){
        stopPolling();
        await loadQueue();          // refresh sidebar statuses
        if(activeId===id) await selectCase(id);  // reload fields + PDF
      }
    }catch(e){ /* keep polling */ }
  }, 5000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function renderViewer(){
  const d = QUEUE.find(x=>x.id===activeId) || QUEUE[0];
  if(!d){ return; }
  document.getElementById('vTitle').textContent = `${d.type} — ${(d.id||'').slice(0,8)}…`;
  document.getElementById('vSub').textContent = `${d.applicant} · ${d.time}`;
  const idx = QUEUE.findIndex(x=>x.id===d.id);
  const total = QUEUE.length;
  document.getElementById('pgNum').textContent = `${idx+1} / ${total}`;
  document.getElementById('pgnav').style.display = total <= 1 ? 'none' : 'flex';
  document.getElementById('prevPg').disabled = idx <= 0;
  document.getElementById('nextPg').disabled = idx >= total-1;

  const canvas = document.getElementById('canvas');
  // Always render the REAL uploaded PDF from the backend. While the case is
  // still processing, overlay a small "extracting" badge on top of it.
  const badge = d.status==='processing'
    ? `<div style="position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;
         display:flex;align-items:center;gap:8px;background:#1a1f2e;color:#fbf0db;
         padding:7px 15px;border-radius:999px;font-size:12px;font-weight:600;
         box-shadow:0 4px 16px rgba(0,0,0,.4);">
         <svg class="spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b8791a" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
         Extracting fields… auto-updates when ready</div>`
    : '';
  canvas.innerHTML = `<div style="position:relative;width:100%;height:100%;display:flex;">
    ${badge}
    <iframe title="notice pdf" src="${API}/queue/${encodeURIComponent(d.id)}/pdf#toolbar=1"
      style="flex:1;width:100%;height:100%;min-height:520px;border:none;border-radius:6px;
      background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.32);"></iframe>
  </div>`;
}

function renderSummary(){
  const scored = FIELDS.filter(f=>f.type!=='textarea');
  const fields = scored.length;
  const needReview = scored.filter(f=>f.conf<CONF_THRESHOLD).length;
  const native = scored.filter(f=>f.src==='native' && f.conf>=CONF_THRESHOLD).length;
  const llm = scored.filter(f=>f.src==='llm' && f.conf>=CONF_THRESHOLD).length;
  const stats = [
    {n:fields, l:'Fields', color:'var(--ink-soft)', bg:'var(--line-soft)'},
    {n:needReview, l:'Need Review', color:'var(--orange)', bg:'var(--orange-soft)'},
    {n:native, l:'Native', color:'var(--blue)', bg:'var(--blue-soft)'},
    {n:llm, l:'LLM', color:'var(--violet)', bg:'var(--violet-soft)'},
  ];
  document.getElementById('summary').innerHTML = stats.map(s=>
    `<span class="stat" style="color:${s.color};background:${s.bg};"><b>${s.n}</b> ${s.l}</span>`
  ).join('');
}

function renderFields(){
  renderSummary();
  const d = QUEUE.find(x=>x.id===activeId);
  const isCompleted = d && (d.status==='completed' || d.status==='failed');

  // Hide action buttons for completed/failed cases
  document.getElementById('factions').style.display = isCompleted ? 'none' : 'flex';

  if(!FIELDS.length){
    const msg = (d && d.status==='processing')
      ? 'Extraction in progress… fields will appear automatically.'
      : 'No fields extracted for this case.';
    document.getElementById('flist').innerHTML =
      `<div style="padding:24px;color:var(--ink-faint);font-size:13px;text-align:center;">${msg}</div>`;
    return;
  }
  document.getElementById('flist').innerHTML = FIELDS.map((f,i)=>{
    const isNotes = f.type==='textarea';
    const isDefault = f.is_default;
    const lowConf = !isNotes && !isDefault && f.conf<CONF_THRESHOLD;
    const tone = confTone(f.conf);
    let className = '';
    if(isDefault) className = 'default';
    else if(lowConf) className = 'low';
    const disabled = isCompleted ? 'disabled' : '';
    return `<div class="field ${className}" data-field-row="${i}">
      <div class="field-top">
        <span class="field-key">${f.key}</span>
        <div class="field-meta">
          ${isNotes ? '' : `
            <span class="src ${f.src}">${f.src==='native'?'Native':'LLM'}</span>
            <span class="pct" style="color:${tone};font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;">${f.conf}%</span>`}
        </div>
      </div>
      <div class="field-input">
        ${f.type==='date'
          ? `<input type="date" data-fi="${i}" value="${f.value??''}" placeholder="mm/dd/yyyy" ${disabled} />${ICON.calendar}`
        : f.type==='select'
          ? `<select data-fi="${i}" ${disabled}>${(f.options||[]).filter(o=>o!=null).map(o=>`<option ${o===f.value?'selected':''}>${o}</option>`).join('')}</select>${ICON.chevron}`
        : f.type==='textarea'
          ? `<textarea data-fi="${i}" rows="3" placeholder="Add notes…" ${disabled}>${f.value??''}</textarea>`
        : f.type==='number'
          ? `<input type="text" data-fi="${i}" inputmode="numeric" value="${f.value??''}" ${disabled} />${ICON.pencil}`
          : `<input data-fi="${i}" value="${f.value??''}" ${disabled} />${ICON.pencil}`}
      </div>
      ${fieldFootHTML(f,i,lowConf,isCompleted)}
    </div>`;
  }).join('');

  wireFieldInputs();
}

/* Footer of a field row: Manual-Review warning + (when edited) a per-field
   Confirm button, or a "Verified" badge once it's been confirmed. */
function fieldFootHTML(f,i,lowConf,isCompleted){
  if(f.verified){
    return `<div class="field-verified">${ICON.check}Verified</div>`;
  }
  if(!lowConf) return '';
  const warn = `<span class="field-warn">${ICON.spark}Manual Review — verify against original</span>`;
  const btn = (!isCompleted && f.edited)
    ? `<button class="btn-field-confirm" data-confirm-field="${i}">${ICON.check}Confirm field</button>`
    : '';
  return `<div class="field-foot">${warn}${btn}</div>`;
}

/* Attach input + per-field-confirm handlers after each render. */
function wireFieldInputs(){
  document.querySelectorAll('#flist [data-fi]').forEach(el=>{
    const i = +el.dataset.fi;
    const handler = ()=>{
      const f = FIELDS[i];
      if(!f) return;
      f.value = el.value;
      if(!f.edited){ f.edited = true; refreshFieldFoot(i); }
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  document.querySelectorAll('#flist [data-confirm-field]').forEach(btn=>{
    btn.onclick = ()=>confirmSingleField(+btn.dataset.confirmField, btn);
  });
}

/* Re-render just one field's footer (cheaper + avoids losing input focus). */
function refreshFieldFoot(i){
  const row = document.querySelector(`#flist [data-field-row="${i}"]`);
  if(!row) return;
  const f = FIELDS[i];
  const isNotes = f.type==='textarea';
  const lowConf = !isNotes && !f.is_default && f.conf<CONF_THRESHOLD;
  const d = QUEUE.find(x=>x.id===activeId);
  const isCompleted = d && (d.status==='completed' || d.status==='failed');
  const existing = row.querySelector('.field-foot, .field-verified');
  const html = fieldFootHTML(f,i,lowConf,isCompleted);
  if(existing){ existing.outerHTML = html; }
  else if(html){ row.insertAdjacentHTML('beforeend', html); }
  // re-wire the (possibly new) confirm button
  const newBtn = row.querySelector('[data-confirm-field]');
  if(newBtn){ newBtn.onclick = ()=>confirmSingleField(i, newBtn); }
}

/* Per-field confirm: save this one field, mark it verified (100%), keep the
   reviewer on the case. The file only moves to processed on "Confirm All". */
async function confirmSingleField(i, btn){
  const f = FIELDS[i];
  if(!f || !activeId) return;
  const input = document.querySelector(`#flist [data-fi="${i}"]`);
  if(input) f.value = input.value;
  btn.disabled = true; btn.innerHTML = `${ICON.spin}Confirming…`;
  try{
    const r = await fetch(`${API}/queue/${encodeURIComponent(activeId)}/field`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({field_name:f.name, value:f.value})
    });
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.detail||('HTTP '+r.status)); }
    f.conf = 100; f.verified = true; f.edited = false;
    renderFields();   // refresh summary counts + clear the Manual Review flag
  }catch(e){
    console.error('[GIP] field confirm failed', e);
    alert('Field save failed: ' + e.message);
    btn.disabled = false; btn.innerHTML = `${ICON.check}Confirm field`;
  }
}

function renderAll(){ renderNav(); renderList(); renderViewer(); renderFields(); }

document.getElementById('prevPg').onclick=()=>{
  const i = QUEUE.findIndex(x=>x.id===activeId);
  if(i>0) selectCase(QUEUE[i-1].id);
};
document.getElementById('nextPg').onclick=()=>{
  const i = QUEUE.findIndex(x=>x.id===activeId);
  if(i<QUEUE.length-1) selectCase(QUEUE[i+1].id);
};

/* Confirm — collect current field values and POST to the backend, then advance. */
document.getElementById('confirmBtn').onclick = async ()=>{
  if(!activeId) return;
  const btn = document.getElementById('confirmBtn');
  const orig = btn.innerHTML;
  // Stay on the case, show "Confirming…", and save to the DB before advancing.
  btn.disabled = true; btn.innerHTML = `${ICON.spin}Confirming…`;
  // pull the latest value straight from each rendered input (FIELDS order)
  const fields = FIELDS.map((f,i)=>{
    const el = document.querySelector(`#flist [data-fi="${i}"]`);
    return { field_name: f.name, confirmed_value: el && el.value != null ? el.value : (f.value||'') };
  });
  try{
    const r = await fetch(`${API}/queue/${encodeURIComponent(activeId)}/confirm`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fields})
    });
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.detail||('HTTP '+r.status)); }
    // Saved. Now advance. Refresh the queue in the background so the jump is instant.
    const doneId = activeId;
    await loadQueue();
    const remaining = QUEUE.filter(x=>x.id!==doneId && x.status!=='completed' && x.status!=='approved');
    if(remaining.length){ await selectCase(remaining[0].id); }
    else { window.location.href = 'gip-notice-list.html'; return; }
    btn.disabled = false; btn.innerHTML = orig;
  }catch(e){
    console.error('[GIP] confirm failed', e);
    alert('Save failed: ' + e.message);
    btn.disabled=false; btn.innerHTML = orig;
  }
};

document.getElementById('collapseBtn').onclick = ()=>{
  document.getElementById('sidebar').classList.toggle('collapsed');
};
document.getElementById('brandIcon').onclick = ()=>{
  document.getElementById('sidebar').classList.remove('collapsed');
};

document.getElementById('qToggle').onclick = ()=>{
  const collapsed = document.getElementById('queue').classList.toggle('collapsed');
  document.getElementById('workspace').classList.toggle('q-collapsed', collapsed);
  document.getElementById('qToggle').title = collapsed ? 'Expand panel' : 'Collapse panel';
};

/* ─── Load the queue + the requested case from the backend ─── */
async function loadQueue(){
  try{
    const data = await fetch(`${API}/queue?status=all&limit=500`).then(r=>r.json());
    let rows = (data.cases || []).map(mapQueueCase).filter(x=>x.status !== 'processing');
    // If a batch subset was passed from the list page, restrict the queue to it
    if(batchIds && batchIds.length){
      const set = new Set(batchIds);
      rows = rows.filter(x=>set.has(x.id));
    }
    QUEUE = rows;
    renderList();
  }catch(e){
    console.error('[GIP] queue load failed', e);
    QUEUE = [];
    renderList();
  }
}

/* ─── auth guard ─── */
if(!localStorage.getItem('access_token')) window.location.href = 'login.html';

(async function init(){
  renderNav();

  // Load operator threshold so "Need Review" flags match the auto-approve logic
  try{
    const s = await fetch(`${API}/settings`).then(r=>r.json());
    const pct = s.confidence_threshold_pct ?? Math.round((s.confidence_threshold ?? 0.8) * 100);
    CONF_THRESHOLD = pct;
  }catch(e){ /* keep default 80 */ }

  const params = new URLSearchParams(window.location.search);
  const caseParam = params.get('case');
  const batchParam = params.get('batch');
  if(batchParam) batchIds = batchParam.split(',').filter(Boolean);

  await loadQueue();

  // Pick the case to show: explicit ?case=, else first in queue
  let target = caseParam && QUEUE.find(x=>x.id===caseParam) ? caseParam
             : (QUEUE[0] && QUEUE[0].id);

  if(target){
    await selectCase(target);
  } else {
    // empty queue
    document.getElementById('vTitle').textContent = 'No cases';
    document.getElementById('vSub').textContent = 'Upload a notice from the queue list';
    document.getElementById('flist').innerHTML =
      '<div style="padding:24px;color:var(--ink-faint);font-size:13px;">No cases to review.</div>';
  }

  // auto-refresh countdown indicator (cosmetic) + periodic queue refresh
  let r = 30;
  setInterval(()=>{
    r = r<=1 ? 30 : r-1;
    const el = document.getElementById('refresh');
    if(el) el.textContent = r;
    if(r===30) loadQueue();
  }, 1000);
})();
</script>
</script>
</body>
</html>
